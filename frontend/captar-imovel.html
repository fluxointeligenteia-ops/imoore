<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Captação rápida | Imoore</title>
<link rel="icon" href="assets/imoore-favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--orange:#ff4b00;--orange-soft:#fff1eb;--ink:#15151a;--muted:#676973;--line:#e8e8ee;--bg:#f6f7fb;--good:#11845b;--bad:#c53232;--shadow:0 18px 45px rgba(22,24,30,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.top-actions{display:flex;gap:8px}
.icon-btn,.btn{border:0;border-radius:8px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;font-weight:800}
.icon-btn{width:42px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn{padding:0 16px;background:var(--orange);color:#fff;box-shadow:0 10px 22px rgba(255,75,0,.18)}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.65;cursor:not-allowed}
/* IMOORE STANDARD BUTTON TEST */
.btn-p,.btn-ok,.btn-err,.btn-login,.button,.btn:not(.secondary){background:linear-gradient(90deg,#FF5500 0%,#FF7A1A 100%)!important;color:#fff!important;border:3px solid rgba(255,255,255,.96)!important;border-radius:999px!important;box-shadow:0 8px 0 rgba(26,22,20,.13),0 14px 26px rgba(26,22,20,.17)!important;text-shadow:0 1px 2px rgba(90,32,0,.24);overflow:hidden}
.btn-p:hover,.btn-ok:hover,.btn-err:hover,.btn-login:hover,.button:hover,.btn:not(.secondary):hover{filter:saturate(1.08) brightness(1.02);transform:translateY(-1px);box-shadow:0 6px 0 rgba(26,22,20,.13),0 16px 30px rgba(26,22,20,.20)!important}
.btn-o,.btn.secondary,.button-secondary{border-radius:999px!important}

main{width:min(760px,100%);margin:0 auto;padding:18px 14px 48px}
.intro{padding:8px 2px 18px}
.kicker{display:inline-flex;align-items:center;gap:7px;color:var(--orange);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
h1{font-size:28px;line-height:1.08;margin-bottom:8px;letter-spacing:0}
.intro p{color:var(--muted);font-size:14px;line-height:1.55;max-width:620px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.section{padding:18px 16px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#30323a}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,75,0,.11)}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
.drop{border:1px dashed #d8d8e0;background:#fbfbfd;border-radius:8px;padding:16px;display:flex;align-items:center;gap:12px}
.drop i{font-size:24px;color:var(--orange)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#eee;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px}
.submit-row{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.submit-row .btn{flex:1;max-width:280px}
.status{display:none;margin:14px 0 0;border-radius:8px;padding:12px 13px;font-size:13px;line-height:1.45;font-weight:700}
.status.ok{display:block;background:#eaf8f1;color:var(--good)}
.status.err{display:block;background:#fff0f0;color:var(--bad)}
.success-actions{display:none;gap:10px;flex-wrap:wrap;margin-top:12px}
.success-actions.on{display:flex}
.dev{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;color:#80828b;font-size:11px;font-weight:700}
.dev img{width:22px;height:22px;border-radius:6px}

/* Demo Mode: marketing-only simulation. It never sends data to the API. */
.demo-mode{background:radial-gradient(circle at top,#fff7f2 0,#f7f8fb 42%,#f3f4f8 100%)}
.demo-mode .top{box-shadow:0 18px 44px rgba(20,18,17,.08)}
.demo-shell{position:fixed;right:18px;bottom:18px;z-index:30;width:min(360px,calc(100vw - 28px));background:rgba(255,255,255,.88);border:1px solid rgba(255,75,0,.18);box-shadow:0 24px 70px rgba(24,23,22,.16);backdrop-filter:blur(18px);border-radius:16px;padding:14px}
.demo-shell strong{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.demo-shell strong i{color:var(--orange);font-size:18px}
.demo-step{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
.demo-progress{height:7px;background:#f1e7e2;border-radius:999px;overflow:hidden;margin-top:12px}
.demo-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4b00,#ff8a3d);border-radius:inherit;transition:width .7s cubic-bezier(.22,1,.36,1)}
.demo-controls{display:flex;gap:8px;margin-top:12px}
.demo-controls .btn,.demo-controls .btn.secondary{min-height:34px;font-size:11px;padding:0 12px}
.demo-spotlight{position:relative;z-index:2;animation:demoPulse 1.7s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,75,0,.12),0 0 0 11px rgba(255,75,0,.06)!important}
.demo-filled{animation:demoField .55s ease both}
.demo-mode .panel{transform-origin:top center;animation:demoPanelIn .8s cubic-bezier(.22,1,.36,1) both}
.demo-thumb-sim{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.7);background:linear-gradient(135deg,#dfe8ef,#fff2ea);box-shadow:0 12px 26px rgba(24,23,22,.10);transform:translateY(10px) scale(.94);opacity:0;animation:demoPhotoIn .55s cubic-bezier(.22,1,.36,1) forwards}
.demo-thumb-sim::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,75,0,.12),rgba(255,255,255,.18)),var(--demo-img);background-size:cover;background-position:center;filter:saturate(1.04)}
.demo-thumb-sim span{position:absolute;left:7px;top:7px;background:rgba(0,0,0,.58);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px}
.demo-thumb-sim em{position:absolute;left:8px;right:8px;bottom:8px;color:#fff;font-style:normal;font-size:10px;font-weight:800;text-shadow:0 1px 5px rgba(0,0,0,.5)}
.demo-publish-card{position:fixed;inset:0;z-index:40;background:rgba(12,12,14,.52);display:grid;place-items:center;padding:18px;backdrop-filter:blur(10px);animation:demoFade .35s ease both}
.demo-publish-card>div{width:min(520px,100%);background:#fff;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.24);animation:demoZoom .55s cubic-bezier(.22,1,.36,1) both}
.demo-check{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff4b00,#ff7a1a);font-size:34px;box-shadow:0 18px 35px rgba(255,75,0,.25)}
.demo-publish-card h3{font-size:24px;margin-bottom:8px}
.demo-publish-card p{font-size:14px;color:var(--muted);line-height:1.55}
.demo-ad-view{animation:demoSlideUp .72s cubic-bezier(.22,1,.36,1) both}
.demo-ad-hero{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;overflow:hidden}
.demo-ad-cover{height:330px;background:linear-gradient(135deg,rgba(255,75,0,.10),rgba(255,255,255,.08)),url('assets/imoveis/lancamento-frente-mar-cibratel-itanhaem-20260804/01-fachada-sobrados-frente-mar.jpg');background-size:cover;background-position:center}
.demo-ad-body{padding:24px}
.demo-live-badge{display:inline-flex;align-items:center;gap:8px;background:#eaf8f1;color:#11845b;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;margin-bottom:12px}
.demo-ad-body h2{font-size:30px;line-height:1.08;margin-bottom:10px}
.demo-ad-price{font-size:26px;color:var(--orange);font-weight:900;margin:16px 0}
.demo-ad-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.demo-ad-metrics span{background:#f7f2ee;border:1px solid #eee1db;border-radius:10px;padding:12px;text-align:center;font-size:12px;font-weight:900}
.demo-reach{margin-top:16px;border-radius:12px;background:linear-gradient(135deg,#171719,#2a2420);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.demo-reach strong{font-size:24px;color:#fff}
.demo-reach small{display:block;color:rgba(255,255,255,.72);font-weight:700}
@keyframes demoPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.05)}}
@keyframes demoField{from{transform:translateY(4px);background:#fff7f2}to{transform:translateY(0);background:#fff}}
@keyframes demoPanelIn{from{opacity:.75;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes demoPhotoIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes demoFade{from{opacity:0}to{opacity:1}}
@keyframes demoZoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes demoSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:620px){
  .brand span{display:none}
  .top{padding:10px 12px}
  main{padding:14px 10px 36px}
  h1{font-size:24px}
  .grid{grid-template-columns:1fr}
  .section{padding:16px 12px}
  .preview{grid-template-columns:repeat(3,1fr)}
  .submit-row{padding:10px 12px}
  .submit-row .btn{max-width:none}
  .demo-shell{right:10px;bottom:10px;padding:12px;border-radius:14px}
  .demo-ad-cover{height:230px}
  .demo-ad-body{padding:18px}
  .demo-ad-body h2{font-size:24px}
  .demo-ad-metrics{grid-template-columns:repeat(2,1fr)}
  .demo-reach{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="assets/imoore-logo-ff5500-transparente.png?v=20260731-correta" alt="Imoore">
    <span id="user-label">Captação interna</span>
  </div>
  <div class="top-actions">
    <a class="icon-btn" id="panel-link" href="/painel/corretor" title="Voltar ao painel" aria-label="Voltar ao painel"><i class="ti ti-layout-dashboard"></i></a>
    <button class="icon-btn" type="button" title="Sair" aria-label="Sair" onclick="logout()"><i class="ti ti-logout"></i></button>
  </div>
</header>

<main>
  <section class="intro">
    <div class="kicker"><i class="ti ti-device-mobile"></i> cadastro rápido</div>
    <h1>Captar imóvel pelo celular</h1>
    <p>Preencha o essencial, envie as fotos e o imóvel entra como pendente para revisão no painel.</p>
  </section>

  <form class="panel" id="capture-form">
    <section class="section">
      <h2><i class="ti ti-home-plus"></i> Dados principais</h2>
      <div class="grid">
        <div class="field full">
          <label for="titulo">Título do imóvel *</label>
          <input id="titulo" name="titulo" required maxlength="120" placeholder="Ex: Casa com piscina no Guaraú">
        </div>
        <div class="field">
          <label for="finalidade">Finalidade *</label>
          <select id="finalidade" name="finalidade" required>
            <option value="Venda">Venda</option>
            <option value="Aluguel">Aluguel</option>
            <option value="Temporada">Temporada</option>
          </select>
        </div>
        <div class="field">
          <label for="tipo">Tipo *</label>
          <select id="tipo" name="tipo" required>
            <option value="Casa">Casa</option>
            <option value="Apartamento">Apartamento</option>
            <option value="Terreno">Terreno</option>
            <option value="Chácara/Sítio">Chácara/Sítio</option>
            <option value="Comercial">Comercial</option>
            <option value="Studio">Studio</option>
            <option value="Cobertura">Cobertura</option>
          </select>
        </div>
        <div class="field">
          <label for="preco">Preço *</label>
          <input id="preco" name="preco" required inputmode="decimal" placeholder="450000 ou 450.000">
        </div>
        <div class="field">
          <label for="cidade">Cidade *</label>
          <select id="cidade" name="cidade" required>
            <option value="">Selecione</option>
            <option>Peruíbe</option><option>Santos</option><option>São Vicente</option>
            <option>Praia Grande</option><option>Itanhaém</option>
            <option>Mongaguá</option><option>Ana Dias</option><option>Itariri</option><option>Pedro de Toledo</option>
          </select>
        </div>
        <div class="field">
          <label for="bairro">Bairro</label>
          <input id="bairro" name="bairro" maxlength="80" placeholder="Centro, Guaraú, Cibratel...">
        </div>
      </div>
    </section>

    <section class="section">
      <h2><i class="ti ti-ruler-measure"></i> Medidas e detalhes</h2>
      <div class="grid">
        <div class="field"><label for="quartos">Quartos</label><input id="quartos" inputmode="numeric" min="0" type="number" placeholder="0"></div>
        <div class="field"><label for="banheiros">Banheiros</label><input id="banheiros" inputmode="numeric" min="0" type="number" placeholder="0"></div>
        <div class="field"><label for="vagas">Vagas</label><input id="vagas" inputmode="numeric" min="0" type="number" placeholder="0"></div>
        <div class="field"><label for="area">Área m²</label><input id="area" inputmode="decimal" placeholder="120"></div>
        <div class="field"><label for="iptu">IPTU</label><input id="iptu" inputmode="decimal" placeholder="Opcional"></div>
        <div class="field"><label for="condominio">Condomínio</label><input id="condominio" inputmode="decimal" placeholder="Opcional"></div>
        <div class="field"><label for="chave">Chave do imóvel</label><input id="chave" maxlength="80" placeholder="Onde retirar / referência"></div>
        <div class="field"><label for="captacao">Captação</label><input id="captacao" maxlength="80" placeholder="Nome de quem captou"></div>
        <div class="field full"><label for="descricao">Descrição</label><textarea id="descricao" maxlength="2500" placeholder="Detalhes importantes, estado do imóvel, documentação, diferenciais..."></textarea></div>
      </div>
    </section>

    <section class="section">
      <h2><i class="ti ti-camera-plus"></i> Fotos</h2>
      <label class="drop" for="fotos">
        <i class="ti ti-photo-up"></i>
        <span><strong>Selecionar fotos</strong><br><span class="hint">Até 8 imagens em JPG, PNG ou WEBP.</span></span>
      </label>
      <input id="fotos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <div class="preview" id="preview"></div>
      <div class="status" id="status"></div>
      <div class="success-actions" id="success-actions">
        <button class="btn secondary" type="button" onclick="resetForm()"><i class="ti ti-plus"></i> Novo cadastro</button>
        <a class="btn secondary" id="success-panel-link" href="/painel/corretor"><i class="ti ti-layout-dashboard"></i> Ver painel</a>
      </div>
    </section>

    <div class="submit-row">
      <button class="btn" id="submit-btn" type="submit"><i class="ti ti-send"></i> Enviar para revisão</button>
    </div>
  </form>

  <div class="dev"><img src="assets/fluxo-inteligente-simbolo.png" alt=""> Fluxo Inteligente</div>
</main>

<script src="api-config.js?v=launchfix-20260711"></script>
<script>
const API_BASE = window.IMOORE_API_BASE || window.API_BASE || '/api';
const allowedProfiles = new Set(['admin', 'corretor']);
const state = { fotos: [] };
// Demo Mode is enabled only by URL and blocks real API submissions.
const DEMO_MODE = new URLSearchParams(window.location.search).get('demo') === 'true';

function getStoredUser() {
  localStorage.removeItem('imoore_token');
  try {
    return JSON.parse(localStorage.getItem('imoore_user') || 'null');
  } catch (error) {
    localStorage.removeItem('imoore_token');
    localStorage.removeItem('imoore_user');
    return null;
  }
}

const user = DEMO_MODE ? { nome: 'Demonstração Imoore', perfil: 'corretor' } : getStoredUser();
const authorized = !!(user && allowedProfiles.has(user.perfil));
if (!authorized && !DEMO_MODE) {
  window.location.href = '/entrar';
}

function logout() {
  if (DEMO_MODE) {
    localStorage.removeItem('imoore_demo_mode');
    window.location.href = '/captar-imovel';
    return;
  }
  fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' }).catch(() => {});
  localStorage.removeItem('imoore_token');
  localStorage.removeItem('imoore_user');
  sessionStorage.removeItem('imoore_token');
  sessionStorage.removeItem('imoore_user');
  window.location.href = '/entrar';
}

function panelUrl() {
  if (DEMO_MODE) return '/captar-imovel?demo=true';
  return user?.perfil === 'admin' ? '/admin' : '/painel/corretor';
}

document.getElementById('panel-link').href = panelUrl();
document.getElementById('success-panel-link').href = panelUrl();
document.getElementById('user-label').textContent = user?.nome ? `Captação - ${user.nome}` : 'Captação interna';

if (DEMO_MODE) {
  document.body.classList.add('demo-mode');
  document.getElementById('user-label').textContent = 'Modo Demonstração';
  document.getElementById('panel-link').title = 'Reiniciar demonstração';
  document.getElementById('panel-link').setAttribute('aria-label', 'Reiniciar demonstração');
} else {
  const demoLink = document.createElement('a');
  demoLink.className = 'btn secondary';
  demoLink.href = '/captar-imovel?demo=true';
  demoLink.innerHTML = '<i class="ti ti-sparkles"></i> Demo';
  document.querySelector('.top-actions').prepend(demoLink);
}

function showStatus(message, type) {
  const box = document.getElementById('status');
  box.textContent = message;
  box.className = `status ${type}`;
}

function clearStatus() {
  const box = document.getElementById('status');
  box.textContent = '';
  box.className = 'status';
}

function normalizeMoney(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  return raw.replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
}

function appendIfFilled(formData, key, value) {
  const clean = String(value || '').trim();
  if (clean) formData.append(key, clean);
}

function renderPreview() {
  const preview = document.getElementById('preview');
  preview.innerHTML = '';
  state.fotos.forEach((file, index) => {
    const item = document.createElement('div');
    item.className = 'thumb';
    const img = document.createElement('img');
    img.alt = `Foto ${index + 1}`;
    img.src = URL.createObjectURL(file);
    img.onload = () => URL.revokeObjectURL(img.src);
    const badge = document.createElement('span');
    badge.textContent = index + 1;
    item.append(img, badge);
    preview.appendChild(item);
  });
}

document.getElementById('fotos').addEventListener('change', event => {
  clearStatus();
  const files = Array.from(event.target.files || []);
  const valid = files.filter(file => ['image/jpeg', 'image/png', 'image/webp'].includes(file.type));
  if (valid.length !== files.length) showStatus('Algumas fotos foram ignoradas por tipo de arquivo inválido.', 'err');
  state.fotos = valid.slice(0, 8);
  if (valid.length > 8) showStatus('Foram mantidas apenas as 8 primeiras fotos.', 'err');
  renderPreview();
});

async function apiRequest(path, options = {}) {
  const isFormData = options.body instanceof FormData;
  const response = await fetch(`${API_BASE}${path}`, {
    ...options,
    credentials: 'include',
    headers: {
      ...(isFormData ? {} : { 'Content-Type': 'application/json' }),
      ...(options.headers || {}),
    },
  });

  if (response.status === 401) {
    logout();
    throw new Error('Sessão expirada');
  }

  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.error || `Erro ${response.status}`);
  }

  return response.json().catch(() => ({}));
}

function appendText(lines, value, label) {
  const clean = String(value || '').trim();
  if (!clean) return;
  lines.push(label ? `${label}: ${clean}` : clean);
}

function buildDescription() {
  const lines = [];
  appendText(lines, document.getElementById('descricao').value);
  appendText(lines, document.getElementById('iptu').value, 'IPTU');
  appendText(lines, document.getElementById('condominio').value, 'Condomínio');
  appendText(lines, document.getElementById('chave').value, 'Chave do imóvel');
  appendText(lines, user?.nome || user?.email, 'Captado por');
  lines.push('Origem: captação interna mobile');
  return lines.join('\n');
}

document.getElementById('capture-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (DEMO_MODE) return;
  clearStatus();
  const submit = document.getElementById('submit-btn');
  submit.disabled = true;
  submit.innerHTML = '<i class="ti ti-loader-2"></i> Enviando...';

  try {
    const formData = new FormData();
    formData.append('titulo', document.getElementById('titulo').value.trim());
    formData.append('tipo', document.getElementById('tipo').value);
    formData.append('finalidade', document.getElementById('finalidade').value);
    formData.append('preco', normalizeMoney(document.getElementById('preco').value));
    formData.append('cidade', document.getElementById('cidade').value);
    appendIfFilled(formData, 'bairro', document.getElementById('bairro').value);
    appendIfFilled(formData, 'quartos', document.getElementById('quartos').value);
    appendIfFilled(formData, 'banheiros', document.getElementById('banheiros').value);
    appendIfFilled(formData, 'vagas', document.getElementById('vagas').value);
    appendIfFilled(formData, 'area', normalizeMoney(document.getElementById('area').value));
    appendIfFilled(formData, 'captacao', document.getElementById('captacao').value || user?.nome || user?.email);
    formData.append('descricao', buildDescription());
    state.fotos.forEach(file => formData.append('fotos', file));

    await apiRequest('/imoveis', { method: 'POST', body: formData });
    showStatus('Imóvel enviado para revisão com sucesso.', 'ok');
    document.getElementById('success-actions').classList.add('on');
    event.target.scrollIntoView({ behavior: 'smooth', block: 'end' });
  } catch (error) {
    showStatus(error.message || 'Não foi possível cadastrar o imóvel agora.', 'err');
  } finally {
    submit.disabled = false;
    submit.innerHTML = '<i class="ti ti-send"></i> Enviar para revisão';
  }
});

function resetForm() {
  document.getElementById('capture-form').reset();
  state.fotos = [];
  renderPreview();
  clearStatus();
  document.getElementById('success-actions').classList.remove('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setDemoStep(message, percent) {
  const step = document.getElementById('demo-step');
  const bar = document.getElementById('demo-progress-bar');
  if (step) step.textContent = message;
  if (bar) bar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
}

function spotlight(element) {
  document.querySelectorAll('.demo-spotlight').forEach(item => item.classList.remove('demo-spotlight'));
  if (!element) return;
  element.classList.add('demo-spotlight');
  element.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function fillDemoField(id, value, delay = 620) {
  const element = document.getElementById(id);
  if (!element) return;
  spotlight(element);
  await wait(260);
  element.value = value;
  element.dispatchEvent(new Event('input', { bubbles: true }));
  element.dispatchEvent(new Event('change', { bubbles: true }));
  element.classList.remove('demo-filled');
  void element.offsetWidth;
  element.classList.add('demo-filled');
  await wait(delay);
}

function createDemoShell() {
  const shell = document.createElement('aside');
  shell.className = 'demo-shell';
  shell.innerHTML = `
    <strong><i class="ti ti-sparkles"></i> Demonstração Imoore</strong>
    <div class="demo-step" id="demo-step">Preparando uma captação fictícia para gravação...</div>
    <div class="demo-progress" aria-hidden="true"><span id="demo-progress-bar"></span></div>
    <div class="demo-controls">
      <a class="btn secondary" href="/captar-imovel?demo=true"><i class="ti ti-refresh"></i> Reiniciar</a>
      <a class="btn secondary" href="/captar-imovel"><i class="ti ti-x"></i> Sair</a>
    </div>`;
  document.body.appendChild(shell);
}

async function simulateDemoPhotos() {
  const preview = document.getElementById('preview');
  const labels = ['Fachada', 'Sala', 'Piscina', 'Área gourmet', 'Suíte', 'Quarto 2', 'Cozinha', 'Banheiro', 'Quintal', 'Garagem', 'Varanda', 'Vista', 'Detalhe', 'Lazer', 'Localização'];
  const images = [
    'url("assets/imoveis/lancamento-frente-mar-cibratel-itanhaem-20260804/01-fachada-sobrados-frente-mar.jpg")',
    'url("assets/imoveis/lancamento-frente-mar-cibratel-itanhaem-20260804/02-area-externa-piscina.jpg")',
    'url("assets/imoveis/lancamento-frente-mar-cibratel-itanhaem-20260804/04-sala-jardim-interno.jpg")',
    'url("assets/imoveis/lancamento-frente-mar-cibratel-itanhaem-20260804/05-sala-integrada.jpg")'
  ];
  preview.innerHTML = '';
  spotlight(document.querySelector('.drop'));
  for (let index = 0; index < 15; index += 1) {
    const item = document.createElement('div');
    item.className = 'demo-thumb-sim';
    item.style.setProperty('--demo-img', images[index % images.length]);
    item.style.animationDelay = `${Math.min(index * 45, 420)}ms`;
    item.innerHTML = `<span>${String(index + 1).padStart(2, '0')}</span><em>${labels[index]}</em>`;
    preview.appendChild(item);
    setDemoStep(`Upload simulado: ${index + 1} de 15 fotos adicionadas`, 50 + index * 2);
    await wait(560);
  }
}

async function showDemoPublish() {

    <div>

if (DEMO_MODE) initImooreDemoMode();
