<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Análise de corretores | Imoore</title><style>body{font:15px Arial,sans-serif;background:#f6f3ef;color:#211b17;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}header,.row{background:#fff;border:1px solid #e5ded8;border-radius:12px;padding:18px;margin:12px 0}.row{display:grid;grid-template-columns:2fr 2fr 1fr;gap:14px;align-items:center}.muted{color:#6b625c;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 13px;border:0;border-radius:18px;background:#f26522;color:white;font-weight:700;cursor:pointer}.reject{background:#b42318}.empty{padding:26px;text-align:center;color:#6b625c}#msg{color:#b42318}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><header><h1>Revisão de candidaturas de corretores</h1><p>Área restrita a administradores. Revise o cadastro antes de aprovar.</p><button id="reload">Atualizar</button> <button id="logout">Sair</button><p id="msg"></p></header><section id="list"></section></main>
<script>
const token=localStorage.getItem('imoore_token');let user=null;try{user=JSON.parse(localStorage.getItem('imoore_user')||'null')}catch{}
if(!token||user?.perfil!=='admin'){location.href='imoore-entrar.html'}
async function request(path,options={}){const r=await fetch('/api/corretores'+path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Falha na solicitação');return d}
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const list=document.getElementById('list'),msg=document.getElementById('msg');msg.textContent='';list.innerHTML='Carregando…';try{const rows=await request('/');const pending=rows.filter(x=>x.status==='pendente');list.innerHTML=pending.length?pending.map(x=>`<article class="row"><div><strong>${safe(x.nome)}</strong><p class="muted">${safe(x.email)} · ${safe(x.telefone)}</p><p class="muted">CRECI: ${safe(x.creci)} · ${safe(x.cidade)} · Experiência: ${safe(x.experiencia||'—')} · Empresa: ${safe(x.imobiliaria||'—')}</p><p class="muted">Aviso ${safe(x.consentimento_versao)} aceito em ${safe(new Date(x.consentimento_em).toLocaleString('pt-BR'))}; contato opcional: ${x.aceite_contato?'sim':'não'}</p></div><div class="muted">Status: pendente<br>Sem envio de CPF/CNH nesta etapa.</div><div class="actions"><button onclick="approve('${safe(x.id)}')">Aprovar e provisionar conta</button><button class="reject" onclick="rejectApplication('${safe(x.id)}')">Rejeitar</button></div></article>`).join(''):'<p class="empty">Nenhuma candidatura pendente.</p>';}catch(e){list.innerHTML='';msg.textContent=e.message;}}
async function approve(id){const password=prompt('Defina uma senha temporária forte (mínimo 12 caracteres). Entregue-a ao corretor por um canal seguro; não a reutilize.');if(!password)return;try{await request(`/${encodeURIComponent(id)}/aprovar`,{method:'POST',body:JSON.stringify({senha_temporaria:password})});alert('Candidatura aprovada e conta provisionada.');await load()}catch(e){alert(e.message)}}
async function rejectApplication(id){const motivo=prompt('Motivo da rejeição (opcional):')||'';try{await request(`/${encodeURIComponent(id)}/rejeitar`,{method:'POST',body:JSON.stringify({motivo})});await load()}catch(e){alert(e.message)}}
document.getElementById('reload').onclick=load;document.getElementById('logout').onclick=()=>{localStorage.removeItem('imoore_token');localStorage.removeItem('imoore_user');location.href='imoore-entrar.html'};load();
</script></body></html>
